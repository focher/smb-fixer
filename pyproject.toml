[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smbfixer"
version = "0.1.0"
description = "Diagnose and tune SMB connections between macOS clients and Samba hosts (Unraid first)."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
smbfixer = "smbfixer.cli:main"

[tool.setuptools.packages.find]
include = ["smbfixer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
